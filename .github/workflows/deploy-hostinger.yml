name: Hostinger 2 — AXA-Kenneth

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, private staging transfer, or approved production upload
        type: choice
        default: validate
        options: [validate, staging, production]
      backup_reference:
        description: 'Production only: verified private backup receipt (date and identifier)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: axa-kenmark-hostinger-2
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'rolex-esto/axa-kenmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
          MYSQL_DATABASE: axa_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install PHP and Apache for isolated application tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apache2 libapache2-mod-php8.3 php8.3-cli php8.3-mysql php8.3-mbstring php8.3-curl php8.3-zip
      - name: Lint, build established release, and run existing suites
        run: bash .github/deployment/ci.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit release and test transfer safeguards
        run: |
          python -m pip install -r .github/deployment/requirements.txt
          python -m unittest discover -s .github/deployment -p 'test_*.py'
          python .github/deployment/sftp_release.py audit
      - name: Retain credential-free release and review records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hostinger-2-${{ github.sha }}
          path: dist/hostinger/
          if-no-files-found: error
          retention-days: 14

  transfer:
    needs: release
    if: inputs.mode == 'staging' || inputs.mode == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: hostinger-2-${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enforce first live deployment approval and backup receipt
        if: inputs.mode == 'production'
        env:
          APPROVED_SHA: ${{ vars.HOSTINGER_2_APPROVED_PRODUCTION_SHA }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: |
          test "$APPROVED_SHA" = "$GITHUB_SHA" || { echo 'This commit lacks explicit production approval.'; exit 1; }
          test "${#BACKUP_REFERENCE}" -ge 12 || { echo 'A verified private backup receipt is required.'; exit 1; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rebuild credential-free source release
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-cli php8.3-zip
          php scripts/build-hostinger-package.php
          python -m pip install -r .github/deployment/requirements.txt
      - name: Validate destination, transfer via SFTP, and verify remote hashes
        env:
          DEPLOY_MODE: ${{ inputs.mode }}
          HOSTINGER_SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          HOSTINGER_SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
          HOSTINGER_SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          HOSTINGER_SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: python .github/deployment/sftp_release.py transfer
      - name: Production HTTP acceptance (no credentials or form submissions)
        if: inputs.mode == 'production'
        run: |
          sudo apt-get install -y php8.3-curl
          php scripts/check-hostinger-http.php https://techtalkmnl.com/axa-kenmark
          curl --fail --silent --show-error --max-time 30 --output /dev/null https://techtalkmnl.com/
